<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Song Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17112f, #392065, #8a287f);
  color: white;
}

.container {
  width: 92%;
  max-width: 650px;
  margin: auto;
  padding: 35px 0 60px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 52px;
}

h1 {
  margin: 5px 0;
  font-size: 32px;
}

.subtitle {
  color: #ddd;
  line-height: 1.5;
}

.card {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 22px;
  padding: 22px;
  backdrop-filter: blur(12px);
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.photo-area {
  margin-top: 15px;
  text-align: center;
}

#photoPreview {
  display: none;
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 18px;
  margin: 15px auto;
  border: 3px solid rgba(255,255,255,.7);
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#createBtn {
  background: linear-gradient(90deg,#ff4f9a,#ff8b5e);
  color: white;
}

#createBtn:disabled {
  opacity: .6;
  cursor: wait;
}

.result {
  display: none;
  margin-top: 25px;
  text-align: center;
}

.result-card {
  background: rgba(0,0,0,.25);
  padding: 22px;
  border-radius: 18px;
}

#resultPhoto {
  display: none;
  width: 170px;
  height: 170px;
  object-fit: cover;
  margin: auto;
  border-radius: 18px;
}

#songTitle {
  margin-bottom: 5px;
}

#dedication {
  color: #ddd;
  line-height: 1.5;
}

audio {
  width: 100%;
  margin-top: 20px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.download {
  background: #fff;
  color: #222;
}

.share {
  background: #4cdb8a;
  color: #102319;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 13px;
  background: rgba(0,0,0,.25);
  border-radius: 10px;
  text-align: center;
}

.note {
  font-size: 12px;
  color: #ccc;
  margin-top: 15px;
  text-align: center;
  line-height: 1.5;
}

@media(max-width:520px) {
  .row,
  .actions {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🎂🎵</div>
  <h1>Birthday Song Generator</h1>
  <div class="subtitle">
    Create a personalized birthday song for someone special.
  </div>
</header>

<div class="card">

  <div class="row">

    <div>
      <label for="receiver">🎁 Birthday Person</label>
      <input
        id="receiver"
        type="text"
        placeholder="Example: Sarah"
      >
    </div>

    <div>
      <label for="sender">❤️ From</label>
      <input
        id="sender"
        type="text"
        placeholder="Example: Dad"
      >
    </div>

  </div>

  <label for="message">✍️ Personal Message</label>

  <textarea
    id="message"
    placeholder="Example: We are so proud of you. May all your dreams come true!"
  ></textarea>

  <label for="style">🎼 Song Style</label>

  <select id="style">
    <option value="happy">🎉 Happy Birthday Pop</option>
    <option value="emotional">❤️ Emotional</option>
    <option value="kids">🎈 Kids Birthday</option>
    <option value="romantic">💕 Romantic</option>
    <option value="rock">🎸 Rock</option>
    <option value="dance">💃 Dance</option>
    <option value="acoustic">🎹 Acoustic</option>
  </select>

  <label for="photo">📷 Add a Picture</label>

  <input
    id="photo"
    type="file"
    accept="image/*"
  >

  <div class="photo-area">
    <img id="photoPreview" alt="Birthday photo preview">
  </div>

  <button id="createBtn" onclick="createSong()">
    🎵 Create Birthday Song
  </button>

  <div class="status" id="status">
    🎶 Preparing your personalized birthday song...
  </div>

  <div class="note">
    Your receiver name, sender name, message and photo will be
    included in the birthday dedication.
  </div>

</div>


<div class="result" id="result">

  <div class="result-card">

    <img id="resultPhoto" alt="Birthday photo">

    <h2 id="songTitle">
      🎉 Happy Birthday!
    </h2>

    <p id="dedication"></p>

    <audio
      id="audioPlayer"
      controls
    ></audio>

    <div class="actions">

      <button
        class="download"
        onclick="downloadSong()"
      >
        ⬇️ Download MP3
      </button>

      <button
        class="share"
        onclick="shareSong()"
      >
        📤 Share Song
      </button>

    </div>

  </div>

</div>

</div>


<script>

let selectedPhoto = null;

/*
  IMPORTANT:

  This version builds the complete user interface.

  To generate a REAL AI song/MP3, we will connect
  createSong() to a server/API in the next stage.

  Never put a secret AI API key directly inside this HTML file.
*/


document
  .getElementById("photo")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    selectedPhoto = file;

    const reader = new FileReader();

    reader.onload = function(e) {

      const preview =
        document.getElementById("photoPreview");

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  });


async function createSong() {

  const receiver =
    document.getElementById("receiver").value.trim();

  const sender =
    document.getElementById("sender").value.trim();

  const message =
    document.getElementById("message").value.trim();

  const style =
    document.getElementById("style").value;

  if (!receiver) {

    alert("Please enter the birthday person's name.");

    return;
  }

  if (!sender) {

    alert("Please enter the sender's name.");

    return;
  }


  const button =
    document.getElementById("createBtn");

  const status =
    document.getElementById("status");

  button.disabled = true;

  button.textContent =
    "🎶 Creating Song...";

  status.style.display =
    "block";


  /*
    ==========================================
    REAL MUSIC API WILL BE CONNECTED HERE
    ==========================================

    Example data sent to our backend:

    {
      receiver: receiver,
      sender: sender,
      message: message,
      style: style
    }

    The backend will return something like:

    {
      audioUrl: "https://...song.mp3"
    }

    We will add that connection in the
    next development step.
  */


  await new Promise(
    resolve => setTimeout(resolve, 1200)
  );


  showResult(
    receiver,
    sender,
    message,
    style
  );


  button.disabled = false;

  button.textContent =
    "🎵 Create Another Birthday Song";

  status.style.display =
    "none";
}


function showResult(
  receiver,
  sender,
  message,
  style
) {

  const result =
    document.getElementById("result");

  const title =
    document.getElementById("songTitle");

  const dedication =
    document.getElementById("dedication");

  title.textContent =
    "🎉 Happy Birthday " + receiver + "!";


  let text =
    "A special " +
    style +
    " birthday song for " +
    receiver +
    ", from " +
    sender +
    ".";


  if (message) {

    text +=
      " ❤️ " + message;

  }


  dedication.textContent =
    text;


  if (selectedPhoto) {

    const reader =
      new FileReader();

    reader.onload =
      function(e) {

        const resultPhoto =
          document.getElementById("resultPhoto");

        resultPhoto.src =
          e.target.result;

        resultPhoto.style.display =
          "block";

      };

    reader.readAsDataURL(
      selectedPhoto
    );

  }


  result.style.display =
    "block";


  result.scrollIntoView({
    behavior: "smooth"
  });

}


function downloadSong() {

  const player =
    document.getElementById("audioPlayer");

  if (!player.src) {

    alert(
      "The real MP3 generator is not connected yet. We will connect the music API next."
    );

    return;
  }


  const link =
    document.createElement("a");

  link.href =
    player.src;

  link.download =
    "birthday-song.mp3";

  link.click();

}


async function shareSong() {

  const receiver =
    document.getElementById("receiver").value.trim();

  const sender =
    document.getElementById("sender").value.trim();


  const shareText =
    "🎂 A special birthday song for " +
    receiver +
    " from " +
    sender +
    "!";


  if (navigator.share) {

    try {

      await navigator.share({
        title:
          "Birthday Song for " +
          receiver,

        text:
          shareText,

        url:
          window.location.href
      });

    }

    catch(error) {

      console.log(
        "Sharing cancelled."
      );

    }

  }

  else {

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "Birthday song link copied!"
    );

  }

}

</script>

</body>
</html>
