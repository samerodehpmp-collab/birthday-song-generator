<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Song Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17112f, #392065, #8a287f);
  color: white;
}

.container {
  width: 92%;
  max-width: 650px;
  margin: auto;
  padding: 35px 0 60px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 60px;
}

h1 {
  margin: 8px 0;
  font-size: 32px;
}

.subtitle {
  color: #ddd;
  line-height: 1.5;
}

.card {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 22px;
  padding: 24px;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 45px rgba(0,0,0,0.25);
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  background: rgba(255,255,255,0.10);
  color: white;
  outline: none;
}

input::placeholder,
textarea::placeholder {
  color: #ccc;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

select option {
  color: black;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: linear-gradient(90deg, #ff4fa3, #8f5cff);
  box-shadow: 0 10px 25px rgba(0,0,0,0.20);
}

button:hover {
  opacity: 0.92;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#result {
  margin-top: 25px;
}

.result-card {
  padding: 20px;
  border-radius: 16px;
  background: rgba(0,0,0,0.20);
  text-align: center;
}

audio {
  width: 100%;
  margin-top: 15px;
}

.download-btn {
  display: block;
  margin-top: 15px;
  padding: 13px;
  border-radius: 12px;
  background: #ffffff;
  color: #452064;
  text-decoration: none;
  font-weight: bold;
}

.share-btn {
  margin-top: 10px;
  background: rgba(255,255,255,0.16);
}

.preview {
  margin-top: 15px;
  text-align: center;
}

.preview img {
  max-width: 180px;
  max-height: 180px;
  object-fit: cover;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.25);
}

.loading {
  text-align: center;
  padding: 20px;
}

footer {
  text-align: center;
  margin-top: 25px;
  color: #bbb;
  font-size: 13px;
}

.error {
  color: #ffd1d1;
}

.success {
  color: #caffd3;
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🎂🎵</div>
  <h1>Birthday Song Generator</h1>

  <div class="subtitle">
    Create a personalized birthday song for someone special.
  </div>
</header>

<div class="card">

  <div class="form-group">
    <label for="recipientName">
      🎂 Birthday Person
    </label>

    <input
      id="recipientName"
      type="text"
      placeholder="Example: Sarah"
    >
  </div>

  <div class="form-group">
    <label for="senderName">
      ❤️ From
    </label>

    <input
      id="senderName"
      type="text"
      placeholder="Your name"
    >
  </div>

  <div class="form-group">
    <label for="message">
      💌 Special Message
    </label>

    <textarea
      id="message"
      placeholder="Example: Wishing you happiness, success and an amazing year ahead!"
    ></textarea>
  </div>

  <div class="form-group">
    <label for="style">
      🎶 Music Style
    </label>

    <select id="style">
      <option value="happy">Happy Birthday</option>
      <option value="pop">Pop</option>
      <option value="rock">Rock</option>
      <option value="romantic">Romantic</option>
      <option value="dance">Dance</option>
      <option value="acoustic">Acoustic</option>
      <option value="kids">Kids</option>
    </select>
  </div>

  <div class="form-group">
    <label for="photo">
      📷 Add Photo (optional)
    </label>

    <input
      id="photo"
      type="file"
      accept="image/*"
      onchange="previewPhoto()"
    >

    <div
      id="photoPreview"
      class="preview"
    ></div>
  </div>

  <button
    id="generateBtn"
    onclick="generateSong()"
  >
    🎵 Generate Birthday Song
  </button>

  <div id="result"></div>

</div>

<footer>
  Made with ❤️ for birthdays
</footer>

</div>


<script>

let selectedPhoto = null;
let currentAudioUrl = null;


/* ==============================
   PHOTO PREVIEW
================================ */

function previewPhoto() {

  const input =
    document.getElementById("photo");

  const preview =
    document.getElementById("photoPreview");

  const file =
    input.files[0];

  if (!file) {

    preview.innerHTML = "";

    selectedPhoto = null;

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(event) {

    selectedPhoto =
      event.target.result;

    preview.innerHTML = `
      <img
        src="${selectedPhoto}"
        alt="Birthday photo"
      >
    `;
  };

  reader.readAsDataURL(file);
}


/* ==============================
   GENERATE SONG
================================ */

async function generateSong() {

  const recipientName =
    document
      .getElementById("recipientName")
      .value
      .trim();

  const senderName =
    document
      .getElementById("senderName")
      .value
      .trim();

  const message =
    document
      .getElementById("message")
      .value
      .trim();

  const style =
    document
      .getElementById("style")
      .value;

  const button =
    document
      .getElementById("generateBtn");

  const result =
    document
      .getElementById("result");


  /* VALIDATION */

  if (!recipientName) {

    alert(
      "Please enter the birthday person's name."
    );

    return;
  }


  /* LOADING */

  button.disabled = true;

  button.innerText =
    "🎵 Creating your song...";


  result.innerHTML = `
    <div class="result-card loading">

      <h3>
        🎼 Creating your birthday song...
      </h3>

      <p>
        Please wait.
      </p>

    </div>
  `;


  try {

    /* CALL OUR VERCEL API */

    const response =
      await fetch(
        "/api/generate-song",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            recipientName:
              recipientName,

            senderName:
              senderName,

            message:
              message,

            style:
              style

          })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Song generation failed."
      );

    }


    /* AUDIO URL FROM BACKEND */

    currentAudioUrl =
      data.audioUrl || null;


    /* BUILD RESULT */

    let photoHTML = "";

    if (selectedPhoto) {

      photoHTML = `
        <div class="preview">

          <img
            src="${selectedPhoto}"
            alt="Birthday photo"
          >

        </div>
      `;

    }


    let audioHTML = "";

    if (currentAudioUrl) {

      audioHTML = `

        <audio
          id="birthdayAudio"
          controls
        >

          <source
            src="${currentAudioUrl}"
            type="audio/mpeg"
          >

          Your browser does not
          support audio.

        </audio>


        <a
          class="download-btn"
          href="${currentAudioUrl}"
          download="birthday-song.mp3"
        >

          ⬇ Download MP3

        </a>


        <button
          class="share-btn"
          onclick="shareSong()"
        >

          📤 Share Birthday Song

        </button>

      `;

    } else {

      audioHTML = `

        <p class="error">

          The server responded,
          but no MP3 audio was returned.

        </p>

      `;

    }


    result.innerHTML = `

      <div class="result-card">

        <h2>
          🎉 Happy Birthday
          ${escapeHTML(recipientName)}!
        </h2>


        ${photoHTML}


        ${
          message
          ?
          `
          <p>
            ${escapeHTML(message)}
          </p>
          `
          :
          ""
        }


        ${
          senderName
          ?
          `
          <p>
            ❤️ From
            ${escapeHTML(senderName)}
          </p>
          `
          :
          ""
        }


        ${audioHTML}

      </div>

    `;

  }

  catch (error) {

    console.error(error);


    result.innerHTML = `

      <div class="result-card">

        <h3>
          ❌ Song generation failed
        </h3>

        <p class="error">

          ${escapeHTML(
            error.message
          )}

        </p>

      </div>

    `;

  }

  finally {

    button.disabled = false;

    button.innerText =
      "🎵 Generate Birthday Song";

  }

}


/* ==============================
   SHARE SONG
================================ */

async function shareSong() {

  if (!currentAudioUrl) {

    alert(
      "Generate the song first."
    );

    return;
  }


  const recipientName =
    document
      .getElementById("recipientName")
      .value
      .trim();


  const senderName =
    document
      .getElementById("senderName")
      .value
      .trim();


  const shareText =
    `🎂 A birthday song for ${recipientName}` +
    (
      senderName
      ?
      ` from ${senderName}`
      :
      ""
    );


  if (navigator.share) {

    try {

      await navigator.share({

        title:
          "Birthday Song",

        text:
          shareText,

        url:
          currentAudioUrl

      });

    }

    catch (error) {

      console.log(
        "Share cancelled."
      );

    }

  }

  else {

    try {

      await navigator.clipboard
        .writeText(
          currentAudioUrl
        );

      alert(
        "Song link copied!"
      );

    }

    catch {

      alert(
        "Copy this song link: " +
        currentAudioUrl
      );

    }

  }

}


/* ==============================
   BASIC HTML SAFETY
================================ */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;
}

</script>

</body>
</html>
